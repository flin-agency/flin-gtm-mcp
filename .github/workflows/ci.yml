name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.11'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run bandit -q -r src
      - run: uv export --frozen --all-extras --no-emit-project --no-hashes --no-annotate --no-header -o requirements-audit.txt > /dev/null
      - run: uv run pip-audit --disable-pip --no-deps -r requirements-audit.txt
      - run: uv build
      - run: uv run twine check dist/*.whl dist/*.tar.gz
      - run: uv run python scripts/build_mcpb.py
      - run: uv run python scripts/check_mcpb.py --wheel-dir dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
