name: GitHub release (no PyPI upload)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.11'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . && uv run pytest
      - run: uv build
      - run: uv run twine check dist/*.whl dist/*.tar.gz
      - run: uv run python scripts/build_mcpb.py
      - run: uv run python scripts/check_mcpb.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - name: Publish versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(uv run python -c 'from flin_gtm_mcp import __version__; print(__version__)')
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "flin GTM MCP v$VERSION" --notes-file docs/release-notes.md
