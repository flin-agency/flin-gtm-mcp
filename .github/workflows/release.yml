name: Publish release to PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        default: v0.1.0
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flin-gtm-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download existing release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', os.environ['RELEASE_TAG']):
              raise SystemExit('Expected a release tag such as v0.1.0')
          PY
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir dist
      - name: Validate distributions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m pip install 'twine>=6,<8'
          python -m twine check --strict dist/*
          python - <<'PY'
          import email, os, pathlib, tarfile, zipfile
          version = os.environ['RELEASE_TAG'][1:]
          files = sorted(pathlib.Path('dist').iterdir())
          expected = {f'flin_gtm_mcp-{version}-py3-none-any.whl', f'flin_gtm_mcp-{version}.tar.gz'}
          assert {p.name for p in files} == expected, 'Unexpected distribution files'
          for path in files:
              if path.suffix == '.whl':
                  with zipfile.ZipFile(path) as archive:
                      names = [n for n in archive.namelist() if n.endswith('.dist-info/METADATA')]
                      assert len(names) == 1
                      raw = archive.read(names[0])
              else:
                  with tarfile.open(path) as archive:
                      member = archive.extractfile(f'flin_gtm_mcp-{version}/PKG-INFO')
                      assert member is not None
                      raw = member.read()
              metadata = email.message_from_bytes(raw)
              assert metadata['Name'] == 'flin-gtm-mcp'
              assert metadata['Version'] == version
          PY
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
