name: Release to PyPI and Claude Desktop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release_status.py
  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.11'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run bandit -q -r src
      - run: uv export --frozen --all-extras --no-emit-project --no-hashes --no-annotate --no-header -o requirements-audit.txt > /dev/null
      - run: uv run pip-audit --disable-pip --no-deps -r requirements-audit.txt
      - run: uv build
      - run: uv run twine check --strict dist/*.whl dist/*.tar.gz
      - run: uv run python scripts/build_mcpb.py
      - run: uv run python scripts/check_mcpb.py --wheel-dir dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb
            dist/*.mcpb.sha256
          if-no-files-found: error
          retention-days: 30
  publish-pypi:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flin-gtm-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: artifacts
      - run: |
          mkdir dist
          cp artifacts/*.whl artifacts/*.tar.gz dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
  publish-github:
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist
      - run: uv sync --frozen --extra dev
      - name: Verify PyPI serves the exact tested distributions
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv run python scripts/verify_pypi.py "$RELEASE_VERSION" --dist dist
      - name: Start the Claude bundle against public PyPI
        run: uv run python scripts/check_mcpb.py
      - name: Publish the matching Claude Desktop package and distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/flin_gtm_mcp-$VERSION-py3-none-any.whl" "dist/flin_gtm_mcp-$VERSION.tar.gz" "dist/flin-gtm-mcp-$VERSION-macos.mcpb" "dist/flin-gtm-mcp-$VERSION-macos.mcpb.sha256" --target "$GITHUB_SHA" --title "flin GTM MCP v$VERSION" --notes-file docs/release-notes.md
